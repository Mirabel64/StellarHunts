# =============================================================================
# docker-compose.yml — StellarHunts Local Development Stack
# =============================================================================
#
# One-command local development:
#
#   docker compose up --build
#
# Services:
#   postgres  — PostgreSQL 15 database
#   redis     — Redis 7 cache / pub-sub
#   backend   — NestJS API server  (port 3001)
#   frontend  — Next.js application (port 3000)
#
# The backend waits for postgres and redis to be healthy before starting.
# The frontend waits for the backend to be healthy before starting.
#
# Override any variable by creating a `.env` file in the repo root — Docker
# Compose automatically merges it.  See backend/.env.example for the full
# list of backend variables.
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-stellarshunts}
    volumes:
      # Persist data across container restarts.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on localhost so developers can connect with pgAdmin / psql.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-stellarshunts}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redislocal}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      # Expose on localhost for Redis CLI / GUI access.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redislocal}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Backend (NestJS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}

      # Database — connect to the postgres service above.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-stellarshunts}
      # Auto-sync schema in development; disable in production!
      DATABASE_SYNC: ${DATABASE_SYNC:-true}
      DATABASE_LOAD: ${DATABASE_LOAD:-false}

      # Stellar / Soroban — mock mode for local development.
      # Set STELLAR_MODE=live and provide real contract IDs for testnet.
      STELLAR_MODE: ${STELLAR_MODE:-mock}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      SOROBAN_NFT_CONTRACT_ID: ${SOROBAN_NFT_CONTRACT_ID:-}
      STELLAR_HUNTS_CONTRACT_ID: ${STELLAR_HUNTS_CONTRACT_ID:-}
      STELLAR_HUNTS_NFT_CONTRACT_ID: ${STELLAR_HUNTS_NFT_CONTRACT_ID:-}

      # Redis — connect to the redis service above.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redislocal}
      REDIS_DB: 0
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # The browser connects to the backend via the host machine's localhost,
      # not the Docker network name, because the browser is not inside Docker.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
