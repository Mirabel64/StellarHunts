# Gitleaks configuration for StellarHunts
# This configuration defines rules for detecting secrets in the codebase

title = "gitleaks config"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

# Allowlist specific patterns that are false positives
[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules''',
  '''dist''',
  '''build''',
  '''.next''',
  '''target''',
  '''\.git''',
  '''\.DS_Store''',
  '''README\.md''',
  '''SECURITY\.md''',
  '''SECRETS_ROTATION\.md''',
  '''AGENTS\.md''',
  '''docs/''',
]
