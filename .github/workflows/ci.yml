# CI pipeline for all StellarHunts workspaces (issue #768).
#
# One workflow runs lint, test and build for the three workspaces:
#   - onchain (Rust / Soroban contracts)
#   - frontend (Next.js)
#   - backend (NestJS)
#
# A job fails if any workspace step fails, so a single red check is enough to
# block a merge. After merging, mark these status checks as required in
# GitHub → Settings → Branches → Required status checks:
#   "CI / all-checks" (this aggregate check covers every workspace job)
# or the individual "CI / contracts", "CI / frontend", "CI / backend" checks.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Soroban contracts (Rust) ----------
  contracts:
    name: contracts — build, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain

      # stellar-cli v22.0.0 is not published (release URL 404s) and no step
      # invokes the CLI, so it is not installed. Re-add with a verified release
      # tag if/when a deployment step is introduced.
      #
      # Build for wasm32 — Soroban contracts are deployed as WASM cdylibs.
      # `--locked` reads the committed `onchain/Cargo.lock` verbatim (pinning
      # `ed25519-dalek 2.1.1` to work around the `soroban-env-host 22.1.3` ↔
      # `ed25519-dalek 3.0` trait-bound incompatibility) and fails if the
      # resolved graph would diverge.
      - name: Lint (cargo fmt)
        working-directory: onchain
        run: cargo fmt --all -- --check

      - name: Build contracts
        working-directory: onchain
        run: cargo build --workspace --target wasm32-unknown-unknown --release --locked

      # Tests are built on the host with the `testutils` feature (declared in
      # each contract's `[dev-dependencies] soroban-sdk`) so `mock_all_auths`,
      # `register_contract`, `Address::generate`, etc. are available.
      - name: Test contracts
        working-directory: onchain
        run: cargo test --workspace --locked

  # ---------- Frontend & backend (Node) ----------
  node:
    name: ${{ matrix.workspace }} — lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend has its own package-lock.json — install it standalone to
          # keep jest/ts-jest versions consistent.
          - workspace: backend
            workdir: backend
            install: npm ci
            lint: npm run lint:ci
            test: npm run test
            build: npm run build
          # Frontend is pinned by the root workspace package-lock.json.
          - workspace: frontend
            workdir: .
            install: npm ci
            lint: npm run lint --workspace frontend
            test: echo "no test script yet — build is the gate"
            build: npm run build --workspace frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies (${{ matrix.workspace }})
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.install }}

      - name: Lint (${{ matrix.workspace }})
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.lint }}

      - name: Test (${{ matrix.workspace }})
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.test }}

      - name: Build (${{ matrix.workspace }})
        working-directory: ${{ matrix.workdir }}
        run: npm run build

  # ---------- Aggregate check ----------
  # Single status check that can be marked "required" for branch protection;
  # it only succeeds when every workspace job above succeeded.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: [contracts, node]
    if: always()
    steps:
      - name: Verify all workspace jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more workspace jobs failed."
            exit 1
          fi
          echo "All workspace jobs passed."
